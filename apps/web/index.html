<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnboardOS</title>
    <!-- Inline minimal styles — no external CSS framework in Phase 2A -->
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; }
      .container { max-width: 480px; margin: 80px auto; padding: 2rem; }
      .card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 2rem; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
      h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: .5rem; }
      p { color: #64748b; line-height: 1.5; margin-bottom: 1rem; }
      .btn { display: inline-block; background: #3b82f6; color: white; padding: .6rem 1.4rem; border-radius: 6px; border: none; cursor: pointer; font-size: .95rem; font-weight: 500; text-decoration: none; }
      .btn:hover { background: #2563eb; }
      .btn-sm { font-size: .85rem; padding: .4rem 1rem; background: #64748b; }
      .btn-sm:hover { background: #475569; }
      .badge { display: inline-block; padding: .2rem .7rem; border-radius: 9999px; font-size: .75rem; font-weight: 600; text-transform: uppercase; }
      .badge-admin { background: #dbeafe; color: #1d4ed8; }
      .badge-manager { background: #d1fae5; color: #065f46; }
      .badge-employee { background: #fef3c7; color: #92400e; }
      .error { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .9rem; }
      .info { color: #1e40af; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: .8rem 1rem; margin-bottom: 1rem; font-size: .9rem; }
      .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6rem; }
      .label { font-size: .8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .04em; }
      .value { font-weight: 500; }
      .container-wide { max-width: 960px; margin: 40px auto; padding: 0 1rem; }
      .card + .card { margin-top: 1rem; }
      h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: .6rem; }
      label { display: block; font-size: .85rem; color: #475569; margin-bottom: .25rem; }
      select { font: inherit; padding: .45rem .6rem; border: 1px solid #cbd5e1; border-radius: 6px; background: white; min-width: 16rem; }
      .btn:disabled { background: #94a3b8; cursor: not-allowed; }
      .btn:focus-visible, select:focus-visible, .tab:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
      .toolbar { display: flex; gap: .75rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: 1rem; }
      .pill { display: inline-block; padding: .15rem .6rem; border-radius: 9999px; font-size: .75rem; font-weight: 600; background: #e2e8f0; color: #334155; }
      .pill-progress { background: #fef3c7; color: #92400e; }
      .pill-ok { background: #d1fae5; color: #065f46; }
      table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
      table.data caption { text-align: left; font-weight: 600; margin-bottom: .5rem; }
      table.data th, table.data td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
      table.data th { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: #64748b; }
      .tabs { display: flex; gap: .25rem; border-bottom: 1px solid #cbd5e1; margin: 1rem 0; }
      .tab { font: inherit; background: transparent; border: 1px solid transparent; border-bottom: none; padding: .5rem 1rem; cursor: pointer; border-radius: 6px 6px 0 0; color: #475569; }
      .tab[aria-selected="true"] { background: white; border-color: #cbd5e1; color: #0f172a; font-weight: 600; position: relative; top: 1px; }
      .tab:disabled { cursor: wait; opacity: .6; }
      .banner { border-radius: 6px; padding: .7rem 1rem; font-size: .9rem; margin-bottom: 1rem; border: 1px solid; }
      .banner-warn { background: #fffbeb; border-color: #fcd34d; color: #78350f; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85rem; }
      .prewrap { white-space: pre-wrap; line-height: 1.55; }
      .muted { color: #64748b; font-size: .85rem; }
      .lvl-ERROR { color: #b91c1c; font-weight: 600; } .lvl-WARN { color: #b45309; font-weight: 600; }
      .comment { border-left: 3px solid #cbd5e1; padding-left: .8rem; margin: .8rem 0; }
      input[type="number"] { font: inherit; padding: .45rem .6rem; border: 1px solid #cbd5e1; border-radius: 6px; width: 9rem; }
      textarea { font: inherit; width: 100%; padding: .55rem .65rem; border: 1px solid #cbd5e1; border-radius: 6px; resize: vertical; line-height: 1.45; }
      textarea:focus-visible, input[type="radio"]:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
      textarea[aria-invalid="true"] { border-color: #b91c1c; }
      fieldset { border: 1px solid #e2e8f0; border-radius: 6px; padding: .7rem 1rem; margin-bottom: .9rem; }
      legend { font-size: .85rem; color: #475569; padding: 0 .35rem; }
      .radio { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; font-size: .95rem; color: #1e293b; }
      .timeline { list-style: none; border-left: 2px solid #cbd5e1; margin-left: .4rem; }
      .timeline li { padding: .25rem 0 .25rem .9rem; position: relative; }
      .timeline li::before { content: ""; position: absolute; left: -.42rem; top: .7rem; width: .65rem; height: .65rem; border-radius: 50%; background: #64748b; }
      input[type="number"]:focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
      .pill-bad { background: #fee2e2; color: #991b1b; }
      .pill-stale { background: #e2e8f0; color: #475569; border: 1px dashed #94a3b8; }
      .banner-aws { background: #eff6ff; border-color: #93c5fd; color: #1e3a8a; }
      .run { border: 1px solid #e2e8f0; border-radius: 6px; padding: .8rem 1rem; margin-top: .8rem; }
      .run-stale { background: #f8fafc; opacity: .85; }
      .field-error { color: #b91c1c; font-size: .85rem; margin-top: .25rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
