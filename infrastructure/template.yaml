AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  OnboardOS — Infrastructure Phase 1.
  HTTP API (GET /health), API Lambda, private smoke-test Lambda,
  DynamoDB Core + Events tables with GSIs, CloudWatch logging.
  No Cognito, Bedrock, S3, or scenario runner in this phase.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 7, 14, 30]
    Description: >
      CloudWatch log retention in days. 7 days is appropriate for hackathon use.

# ---------------------------------------------------------------------------
# SAM Globals
# ---------------------------------------------------------------------------
Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 29
    MemorySize: 512
    Architectures:
      - x86_64
    LoggingConfig:
      LogFormat: JSON

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # ── HTTP API ──────────────────────────────────────────────────────────────

  OnboardOSHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      Description: OnboardOS HTTP API — Phase 1 (public GET /health only)
      CorsConfiguration:
        AllowOrigins:
          - "http://localhost:5173"
        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type
        MaxAge: 300

  # ── API Lambda ────────────────────────────────────────────────────────────
  # Handles public GET /health. No DynamoDB permissions in Phase 1.

  OnboardOSApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: OnboardOS API — HTTP routing handler (Phase 1)
      Handler: handler.httpHandler
      CodeUri: ../services/api/
      Role: !GetAtt OnboardOSApiRole.Arn
      Environment:
        Variables:
          ONBOARDOS_CORE_TABLE: !Ref OnboardOSCoreTable
          ONBOARDOS_EVENTS_TABLE: !Ref OnboardOSEventsTable
      Events:
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref OnboardOSHttpApi
            Path: /health
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/handler.ts
        Minify: false
        Sourcemap: false
        Target: es2022
        Format: cjs
        # Bundle all dependencies — do not externalise @aws-sdk/* here because
        # the API function does not use the SDK in Phase 1; the bundle will be
        # very small. When DynamoDB access is added in a later phase, evaluate
        # externalising SDK packages if the Node 24 runtime bundles them.

  # ── Smoke-test Lambda ─────────────────────────────────────────────────────
  # INTERNAL ONLY — no API Gateway event source.
  # Invocable only via `aws lambda invoke` with IAM authorisation.
  # Performs a real DynamoDB write → read (ConsistentRead) → delete round-trip.

  OnboardOSSmokeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: >
        OnboardOS DynamoDB smoke-test — INTERNAL ONLY.
        No API Gateway event source. Invoke via aws lambda invoke with IAM auth.
      Handler: smokeTest.smokeTestHandler
      CodeUri: ../services/api/
      Role: !GetAtt OnboardOSSmokeRole.Arn
      Environment:
        Variables:
          ONBOARDOS_CORE_TABLE: !Ref OnboardOSCoreTable
      # No Events property — this function has no public trigger.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/smokeTest.ts
        Minify: false
        Sourcemap: false
        Target: es2022
        Format: cjs
        # Bundle @aws-sdk packages so the smoke function is self-contained and
        # does not depend on the runtime-provided SDK version.
        External: []

  # ── IAM: API execution role ───────────────────────────────────────────────
  # Phase 1: CloudWatch Logs only. No DynamoDB permissions yet.

  OnboardOSApiRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for OnboardOS API Lambda (Phase 1 - logs only)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OnboardOSApiLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*"

  # ── IAM: Smoke-test execution role ────────────────────────────────────────
  # Narrowly scoped: CloudWatch Logs + DynamoDB on Core table only.
  # No Events table access, no index access, no broad write operations.

  OnboardOSSmokeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for OnboardOS smoke-test Lambda
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: OnboardOSSmokeLogging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*"
        - PolicyName: OnboardOSSmokeDynamoDB
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSmokeRoundTrip
                Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt OnboardOSCoreTable.Arn
                  # No GSI sub-resources — smoke test uses PK/SK primary key only

  # ── DynamoDB: Core table ──────────────────────────────────────────────────
  # Stores current state, memberships, assignments, sessions, config revisions,
  # test runs, submissions, and review records.
  # GSI1: employee assignments lookup
  # GSI2: manager review queue
  # Table name is stack-scoped to prevent collision on shared workshop accounts.

  OnboardOSCoreTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-core"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        # GSI1: employee assignment list
        # GSI1PK = ORG#<orgId>#EMP#<userSub>
        # GSI1SK = ASSIGN#<createdAt>#<id>
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        # GSI2: manager review queue
        # GSI2PK = ORG#<orgId>#MANAGER#<userSub>
        # GSI2SK = REVIEWABLE#<status>#<submittedAt>#<id>
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      # PITR is not enabled — optional paid feature, not required for Phase 1.
      # Enable before production use.

  # ── DynamoDB: Events table ────────────────────────────────────────────────
  # Append-only session event history.
  # PK = SESSION#<sessionId>, SK = SEQ#<zeroPaddedSequence>

  OnboardOSEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub "${AWS::StackName}-events"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE

  # ── CloudWatch log groups ─────────────────────────────────────────────────
  # Explicit log groups ensure retention is set before the first invocation.

  OnboardOSApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${OnboardOSApiFunction}"
      RetentionInDays: !Ref LogRetentionDays

  OnboardOSSmokeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${OnboardOSSmokeFunction}"
      RetentionInDays: !Ref LogRetentionDays

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  ApiUrl:
    Description: Public API base URL (phase 1 exposes GET /health only)
    Value: !Sub "https://${OnboardOSHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  ApiFunctionName:
    Description: API Lambda function name
    Value: !Ref OnboardOSApiFunction

  SmokeFunctionName:
    Description: Smoke-test Lambda function name (internal — IAM auth only)
    Value: !Ref OnboardOSSmokeFunction

  CoreTableName:
    Description: DynamoDB Core table name
    Value: !Ref OnboardOSCoreTable

  EventsTableName:
    Description: DynamoDB Events table name
    Value: !Ref OnboardOSEventsTable
